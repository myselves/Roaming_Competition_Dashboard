  :root { --bg:#F2F6FC; --card:#FFFFFF; --card2:#FBFCFF; --navy:#1E2563; --navy-soft:#3A4180;
    --txt:#2A2F45; --sub:#6B7390; --line:#C9D6EF; --line2:#E2EAF8;
    --accent-blue:#4C7DD4; --accent-sky:#A9C4EC; --accent-pink:#E068B4; --violet:#6A4FC9; --sel:#D63C93;
    --red:#D64550; --blue:#2563CD; --green:#178A50; --amber:#B7791F; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:var(--bg); }
  body { font-family:'Pretendard Variable', Pretendard, -apple-system, 'Malgun Gothic', sans-serif;
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(76,125,212,0.12), transparent 60%),
      radial-gradient(900px 460px at 90% -14%, rgba(224,104,180,0.09), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--txt); padding:44px 32px 80px; font-size:14px;
    max-width:1120px; margin:0 auto; }
  /* 히어로 */
  .hero { margin-bottom:26px; }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:3px; color:var(--accent-blue); margin-bottom:10px; }
  .eyebrow::before { content:"● "; font-size:8px; vertical-align:2px; }
  h1 { font-size:28px; letter-spacing:-0.5px; font-weight:800; margin-bottom:14px;
    background:linear-gradient(90deg, var(--navy) 55%, var(--accent-blue)); -webkit-background-clip:text;
    background-clip:text; -webkit-text-fill-color:transparent; color:var(--navy); }
  .meta { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font-size:12px; color:var(--sub); background:var(--card);
    border:1px solid var(--line2); border-radius:999px; padding:5px 12px;
    box-shadow:0 2px 6px rgba(30,37,99,0.05); }
  .chip b { color:var(--navy); font-weight:700; }
  /* 탭 — 세그먼트 바 */
  .tabs { display:inline-flex; gap:2px; flex-wrap:wrap; margin-bottom:24px;
    background:var(--card); border:1px solid var(--line2);
    border-radius:14px; padding:5px; box-shadow:0 4px 14px rgba(30,37,99,0.07); }
  .tab { padding:8px 15px; border-radius:10px; border:1px solid transparent; background:transparent;
    cursor:pointer; font-size:13.5px; font-weight:600; color:var(--sub); transition:all .16s; }
  .tab:hover { color:var(--navy); background:#F0F4FC; }
  .tab.active { background:linear-gradient(135deg, var(--accent-blue), var(--accent-pink)); color:#fff;
    box-shadow:0 4px 14px rgba(76,125,212,0.35); }
  .page { display:none; } .page.active { display:block; }
  /* 카드 */
  .card { background:linear-gradient(180deg, var(--card), var(--card2)); border:1px solid var(--line2);
    border-radius:18px; padding:24px 26px; margin-bottom:20px;
    box-shadow:0 12px 32px rgba(30,37,99,0.08); }
  .card h2 { font-size:17px; margin-bottom:5px; color:var(--navy); letter-spacing:-0.2px;
    display:flex; align-items:center; gap:9px; }
  .card h2::before { content:""; width:8px; height:8px; border-radius:3px; flex:none;
    background:linear-gradient(135deg, var(--accent-sky), var(--accent-blue));
    box-shadow:0 0 8px rgba(76,125,212,0.5); }
  .card .desc { font-size:12.5px; color:var(--sub); margin-bottom:14px; }
  .tblwrap { overflow-x:auto; border:1px solid var(--line2); border-radius:12px; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; white-space:nowrap; }
  th { background:#EAF0FA; color:var(--navy); padding:10px 12px; border-bottom:1px solid var(--line);
    text-align:left; font-weight:700; font-size:11px; letter-spacing:0.6px; }
  td { padding:9px 12px; border-bottom:1px solid var(--line2); text-align:left; color:var(--txt); }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover td { background:#F7FAFF; }
  tr.pin td { background:linear-gradient(90deg, #F1EDFD, #F8F6FF); font-weight:700; }
  tr.pin td:first-child { border-left:3px solid var(--violet); }
  tr.pin:hover td { background:linear-gradient(90deg, #F1EDFD, #F8F6FF); }
  .neg { color:var(--red); font-weight:700; } .pos { color:var(--blue); font-weight:700; }
  .zero { color:var(--navy); font-weight:800; }
  /* 배지 */
  .badge { display:inline-block; font-size:11.5px; font-weight:800; padding:3px 10px; border-radius:999px; margin-right:8px; }
  .badge.b-top { color:#fff; background:var(--green); box-shadow:0 2px 8px rgba(23,138,80,0.3); }
  .badge.b-good { color:var(--blue); background:rgba(37,99,205,0.08); border:1px solid rgba(37,99,205,0.35); }
  .badge.b-mid { color:var(--amber); background:rgba(183,121,31,0.08); border:1px solid rgba(183,121,31,0.35); }
  .badge.b-low { color:var(--red); background:rgba(214,69,80,0.07); border:1px solid rgba(214,69,80,0.3); }
  .postxt { color:var(--sub); font-size:12px; }
  /* KPI */
  .kpis { display:flex; gap:12px; flex-wrap:wrap; margin:16px 0; }
  .kpi { position:relative; overflow:hidden; background:var(--card); border:1px solid var(--line2);
    border-radius:14px; padding:15px 20px 13px; min-width:180px; flex:1;
    box-shadow:0 4px 12px rgba(30,37,99,0.05); }
  .kpi::before { content:""; position:absolute; top:0; left:0; bottom:0; width:3px;
    background:linear-gradient(180deg, var(--accent-sky), var(--accent-blue)); }
  .kpi.self { background:var(--card); border:2px solid var(--violet);
    box-shadow:0 4px 14px rgba(106,79,201,0.18); }
  .kpi.self::before { background:linear-gradient(180deg, #9F8FE8, var(--violet)); }
  .kpi.self .v { color:var(--violet); }
  .kpi .k { font-size:11px; color:var(--sub); margin-bottom:4px; letter-spacing:0.5px; }
  .kpi .v { font-size:22px; font-weight:800; color:var(--navy); letter-spacing:-0.4px; }
  .kpi .s { font-size:11.5px; color:var(--sub); margin-top:3px; }
  .rank1 { color:var(--green); font-weight:800; }
  /* 가격 막대 */
  .bars { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .barrow { display:grid; grid-template-columns:180px 1fr 160px; align-items:center; gap:12px; font-size:12.5px; }
  .barlabel { text-align:left; color:var(--txt); font-weight:600; }
  .bartrack { background:#E8EEF9; border-radius:99px; height:16px; overflow:hidden; }
  .barfill { height:100%; border-radius:99px; background:linear-gradient(90deg, var(--accent-sky), var(--accent-blue)); }
  .barfill.pin { background:linear-gradient(90deg, #9F8FE8, var(--violet)); box-shadow:0 2px 10px rgba(106,79,201,0.35); }
  .barval { font-size:12px; color:var(--sub); }
  .barrow.pin { background:linear-gradient(90deg, #F3EFFD, rgba(243,239,253,0)); border-radius:10px; padding:4px 10px; margin:0 -10px; }
  .barrow.pin .barlabel { color:var(--violet); font-weight:800; }
  .barrow.pin .barlabel::before { content:"● "; font-size:8px; vertical-align:2px; color:#9F8FE8; }
  .barrow.pin .barval { color:var(--violet); font-weight:700; }
  /* 분석 */
  .analysis h3 { font-size:14px; color:var(--navy); margin:18px 0 7px; padding-left:11px;
    border-left:3px solid var(--accent-blue); }
  .analysis h3:first-child { margin-top:6px; }
  .analysis p { font-size:13.5px; line-height:1.8; margin-bottom:9px; }
  .analysis b { color:var(--accent-blue); }
  .analysis strong { color:#C2419A; }
  .analysis ul { margin:4px 0 10px 2px; list-style:none; }
  .analysis ul li { font-size:13.5px; line-height:1.75; padding-left:17px; position:relative; margin-bottom:5px; }
  .analysis ul li::before { content:"▸"; position:absolute; left:2px; color:var(--accent-blue); }
  .keyline { font-size:13.5px; font-weight:700; color:var(--navy);
    background:linear-gradient(90deg, #FDF1F8, #F4F7FE);
    border:1px solid var(--line2); border-left:3px solid var(--accent-pink); border-radius:12px;
    padding:12px 16px; margin:8px 0 16px; }
  .catnote { margin-top:14px; font-size:13.5px; line-height:1.78; color:var(--txt);
    background:linear-gradient(180deg, #F7F9FF, #F1F5FD); border:1px solid var(--line2);
    border-left:3px solid var(--accent-blue); border-radius:12px; padding:13px 17px; }
  .chgdate { font-size:12.5px; font-weight:800; color:var(--accent-blue); margin:12px 0 5px; letter-spacing:0.3px; }
  .chglist { list-style:none; }
  .chglist li { font-size:13px; line-height:1.75; padding-left:15px; position:relative; }
  .chglist li::before { content:"·"; position:absolute; left:2px; color:var(--accent-blue); font-weight:900; }
  .note { font-size:11px; color:var(--sub); }
  .sectag { display:flex; align-items:center; gap:12px; margin:6px 0 14px; }
  .sectag .pill { font-size:13px; font-weight:800; color:#fff; border-radius:999px; padding:6px 16px; }
  .sectag .pill.p-unl { background:linear-gradient(135deg, #2563CD, #4C7DD4); box-shadow:0 3px 10px rgba(37,99,205,0.3); }
  .sectag .pill.p-dly { background:linear-gradient(135deg, #B7791F, #D99A3D); box-shadow:0 3px 10px rgba(183,121,31,0.3); }
  .sectag .sub { font-size:12px; color:var(--sub); }
  .sectag::after { content:""; flex:1; height:1px; background:var(--line); }
  /* ===== 히스토리·CSV 버튼 (이식) ===== */
  .cardhead {display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  /* 히스토리 */
  .histrow {display:flex; align-items:center; gap:10px; margin:7px 0; flex-wrap:wrap;}
  .histlab {font-size:11.5px; font-weight:700; color:var(--navy-soft); min-width:66px;}

function buildTrendChart() {
  const H = HISTORY.slice(-12);
  const SERIES = [
    {k:"jp", label:"일본 무제한", color:"#2563CD"},
    {k:"jd", label:"일본 매일 1GB", color:"#4C9FD4"},
    {k:"vn", label:"베트남", color:"#178A50"},
    {k:"cn", label:"중국", color:"#D64550"},
    {k:"th", label:"태국", color:"#C77E1F"},
    {k:"eu", label:"유럽 통합", color:"#8B5CF6"},
    {k:"us", label:"미국", color:"#E068B4"},
    {k:"uz", label:"중앙아시아", color:"#0FA3A3"},
    {k:"kr", label:"한국(방한)", color:"#1E3A8A"}
  ];
  const gaps = k => H.map(x => x[k] ? x[k].pin - x[k].min : null);
  const maxY = Math.max(...SERIES.flatMap(s => gaps(s.k).filter(v => v !== null)), 1000) * 1.15;
  const W = 660, Hh = 190, pL = 58, pR = 16, pT = 14, pB = 28;
  const xf = i => H.length === 1 ? pL + (W - pL - pR) / 2 : pL + (W - pL - pR) * i / (H.length - 1);
  const yf = v => pT + (Hh - pT - pB) * (1 - v / maxY);
  let svg = `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;max-width:${W}px;display:block;">`;
  // 가로 눈금 3개 (0 / 절반 / 최대)
  [0, maxY / 2, maxY].forEach(v => {
    svg += `<line x1="${pL}" y1="${yf(v)}" x2="${W - pR}" y2="${yf(v)}" stroke="#E4EBF7" stroke-width="1"/>`;
    svg += `<text x="${pL - 8}" y="${yf(v) + 4}" text-anchor="end" font-size="10" fill="#6B7390">${Math.round(v).toLocaleString("ko-KR")}</text>`;
  });
  svg += `<text x="${pL - 8}" y="${yf(0) + 14}" text-anchor="end" font-size="9" fill="#178A50">= 최저가</text>`;
  // x 라벨 (기준일, 최대 4개)
  const step = Math.max(1, Math.ceil(H.length / 4));
  H.forEach((x, i) => {
    if (i % step === 0 || i === H.length - 1)
      svg += `<text x="${xf(i)}" y="${Hh - 8}" text-anchor="middle" font-size="10" fill="#6B7390">${x.date.slice(5)}</text>`;
  });
  // 시리즈
  for (const s of SERIES) {
    const g = gaps(s.k);
    const pts = g.map((v, i) => v === null ? null : xf(i) + "," + yf(v)).filter(Boolean);
    if (pts.length > 1) svg += `<polyline fill="none" stroke="${s.color}" stroke-width="2" points="${pts.join(" ")}"/>`;
    g.forEach((v, i) => { if (v !== null) svg += `<circle cx="${xf(i)}" cy="${yf(v)}" r="3.5" fill="${s.color}"/>`; });
  }
  svg += `</svg>`;
  const legend = SERIES.map(s => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px;color:var(--txt);"><span style="width:10px;height:10px;border-radius:3px;background:${s.color};display:inline-block;"></span>${s.label}</span>`).join("");
  return `<div class="card"><h2>경쟁력 추이</h2>
    <div class="desc">회차별 격차 = 핀다이렉트 가격 − 카테고리 최저가 (원) · <b>선이 아래로 내려올수록 경쟁력 개선, 0원 = 최저가 지위</b></div>
    <div style="margin:4px 0 8px;">${legend}</div>${svg}</div>`;
}

const HIST_PAGES = [
  {id:"jp", label:"일본 무제한", metric:"가격"},
  {id:"jd", label:"일본 매일 1GB", metric:"가격"},
  {id:"vn", label:"베트남", metric:"가격"},
  {id:"cn", label:"중국", metric:"가격"},
  {id:"th", label:"태국", metric:"가격"},
  {id:"eu", label:"유럽 통합", metric:"가격"},
  {id:"us", label:"미국", metric:"가격"},
  {id:"uz", label:"중앙아시아", metric:"가격"},
  {id:"kr", label:"한국(방한)", metric:"가격"}
];
const HIST_SIG_PAGES = HIST_PAGES.map(p => p.id);
let histState = { page:"jp", n:0, from:null, to:null, sel:null };
function isPin(c){ return c === "핀다이렉트"; }
function esc(c){ return String(c).replace(/'/g, "\\'"); }
function histSigOf(r){ return (!r || !r.sig) ? null : r.sig[histState.page]; }
function histWindow(){
  const _hist = (typeof HIST !== "undefined" ? HIST : []);
  let lo = -Infinity, hi = Infinity;
  if (histState.n === -1) {
    if (histState.from) lo = new Date(histState.from).getTime();
    if (histState.to) hi = new Date(histState.to).getTime() + 86399999;
  } else if (histState.n && _hist.length) {
    lo = new Date(_hist[_hist.length - 1].date).getTime() - histState.n * 86400000;
  }
  return { lo, hi };
}
function histSeries(applyRestart){
  if (applyRestart === undefined) applyRestart = true;
  const _hist = (typeof HIST !== "undefined" ? HIST : []);
  const _w = histWindow();
  let rounds = _hist.filter(r => { const t = new Date(r.date).getTime(); return t >= _w.lo && t <= _w.hi; });
  let restarted = false, restartFrom = null;
  if (applyRestart && HIST_SIG_PAGES.includes(histState.page) && rounds.length) {
    const latest = histSigOf(rounds[rounds.length - 1]);
    if (latest != null) {
      let start = rounds.length - 1;
      while (start > 0 && histSigOf(rounds[start - 1]) === latest) start--;
      if (start > 0) { restarted = true; restartFrom = rounds[start].date; }
      rounds = rounds.slice(start);
    }
  }
  const dates = rounds.map(r => r.date);
  const getMap = r => r[histState.page] || {};
  const companies = [];
  rounds.forEach(r => Object.keys(getMap(r)).forEach(c => { if (!companies.includes(c)) companies.push(c); }));
  const series = {};
  companies.forEach(c => series[c] = rounds.map(r => { const m = getMap(r); return (c in m) ? m[c] : null; }));
  const ordered = companies.filter(isPin).concat(companies.filter(c => !isPin(c)));
  return { dates, series, companies: ordered, restarted, restartFrom };
}
function histChartSvg() {
  const { dates, series, companies } = histSeries();
  if (!companies.length) return `<div class="histempty">표시할 데이터가 없습니다.</div>`;
  const W = 960, H = 360, m = { t:18, r:154, b:46, l:78 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  let vals = []; companies.forEach(c => series[c].forEach(v => { if (v != null) vals.push(v); }));
  // 이상치에 강한 축: 상·하위 극단은 분위수로 잘라 축이 늘어나지 않게 하되,
  // 핀다이렉트·선택 라인 값은 절대 잘리지 않게 범위에 포함시킨다
  const sorted = vals.slice().sort((a,b) => a-b);
  const qi = p => sorted.length ? sorted[Math.min(sorted.length-1, Math.max(0, Math.round((sorted.length-1)*p)))] : 0;
  let lo = qi(0.03), hi = qi(0.97);
  [series["핀다이렉트"], histState.sel ? series[histState.sel] : null].forEach(arr => {
    if (!arr) return;
    arr.forEach(v => { if (v != null) { if (v < lo) lo = v; if (v > hi) hi = v; } });
  });
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  if (lo === hi) { const d = Math.abs(lo) || 10; lo -= d*0.5; hi += d*0.5; }
  else { const padv = (hi - lo) * 0.08; lo = Math.max(0, lo - padv); hi = hi + padv; }
  // 라운드 넘버 눈금: 목표 4~5칸에 맞는 '깔끔한' step으로 상·하한과 눈금을 정렬
  function niceStep(range, target) {
    const raw = range / target, mag = Math.pow(10, Math.floor(Math.log10(raw))), nrm = raw / mag;
    return (nrm < 1.5 ? 1 : nrm < 3 ? 2 : nrm < 7 ? 5 : 10) * mag;
  }
  const step = niceStep(hi - lo || 10, 4);
  let ymin = Math.max(0, Math.floor(lo / step) * step);
  let ymax = Math.ceil(hi / step) * step;
  if (ymax === ymin) ymax = ymin + step;
  const n = dates.length;
  const X = i => m.l + (n === 1 ? iw/2 : iw * i/(n-1));
  // 축 범위를 벗어나는 이상치(회색 라인)는 플롯 영역 경계로 클램프 — 오버플로 방지
  const Y = v => { const y = m.t + ih * (1 - (v - ymin)/(ymax - ymin)); return Math.max(m.t, Math.min(m.t+ih, y)); };
  let grid = "";
  for (let val = ymin; val <= ymax + step*0.001; val += step) { const y = m.t + ih * (1 - (val - ymin)/(ymax - ymin));
    grid += `<line x1="${m.l}" y1="${y.toFixed(1)}" x2="${m.l+iw}" y2="${y.toFixed(1)}" class="histgrid"/>`;
    grid += `<text x="${m.l-8}" y="${(y+3).toFixed(1)}" class="histaxis" text-anchor="end">${fmt(Math.round(val))}</text>`;
  }
  // 가로축 라벨: 회차가 많으면 겹치지 않게 솎아 최대 8~9개만(마지막 회차는 항상 표시)
  const xstride = Math.max(1, Math.ceil(n / 8));
  // 다년 누적 시 MM-DD만으로는 연도 구분이 안 되므로, 표시 구간이 400일을 넘으면 YY-MM-DD로
  const _spanDays = n > 1 ? (new Date(dates[n-1]).getTime() - new Date(dates[0]).getTime()) / 86400000 : 0;
  const xfmt = d => _spanDays > 400 ? d.slice(2) : d.slice(5);
  let xlab = "";
  dates.forEach((d,i) => { if ((n-1-i) % xstride === 0) xlab += `<text x="${X(i).toFixed(1)}" y="${H-m.b+18}" class="histaxis" text-anchor="middle">${xfmt(d)}</text>`; });
  function lineFor(c) {
    // 결측(이탈) 구간에서는 선을 끊는다 — 빈 기간을 가로질러 잇지 않음(이탈→복귀 브랜드 대응)
    const pts = []; let dpath = "", pen = false;
    for (let i = 0; i < series[c].length; i++) {
      const v = series[c][i];
      if (v == null) { pen = false; continue; }
      const x = X(i), y = Y(v);
      dpath += (pen ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1) + " ";
      pen = true; pts.push([x, y]);
    }
    if (!pts.length) return "";
    dpath = dpath.trim();
    const pin = isPin(c), sel = histState.sel === c;
    const lcls = pin ? "histL pin" : sel ? "histL sel" : "histL";
    const dcls = pin ? "histdot pin" : sel ? "histdot sel" : "histdot";
    const showDots = pts.length === 1 || pin || sel;
    // 점이 많으면(장기 구간) 마커를 솎아 최대 ~40개만 — 선은 그대로, 최신 점은 항상 표시
    const dstride = pts.length <= 90 ? 1 : Math.max(1, Math.ceil(pts.length / 60)); // 90점 이하는 모든 점에 마커(점 사이 직선이 그대로 보이게)
    const markers = showDots ? pts.map((p,i) => ((pts.length === 1 || i === pts.length - 1 || i % dstride === 0)
      ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${pin||sel?4:3}" class="${dcls}"/>` : "")).join("") : "";
    const hit = `<path d="${dpath}" fill="none" stroke="transparent" stroke-width="14" style="cursor:pointer" onclick="selectHist('${esc(c)}')"><title>${c}</title></path>`;
    return `<path d="${dpath}" class="${lcls}"/>${markers}${hit}`;
  }
  const order = companies.slice();
  let lines = order.filter(c => !isPin(c) && histState.sel !== c).map(lineFor).join("");
  lines += order.filter(c => isPin(c)).map(lineFor).join("");
  if (histState.sel && !isPin(histState.sel) && series[histState.sel]) lines += lineFor(histState.sel);
  function label(c) { const arr = series[c]; let li = -1; for (let i = arr.length-1; i >= 0; i--) { if (arr[i] != null) { li = i; break; } } if (li < 0) return "";
    const x = X(li), y = Y(arr[li]), pin = isPin(c);
    return `<text x="${(x+8).toFixed(1)}" y="${(y+3).toFixed(1)}" class="histlbl ${pin?'pin':'sel'}">${c}</text>`;
  }
  let labels = order.filter(isPin).map(label).join("");
  if (histState.sel && !isPin(histState.sel) && series[histState.sel]) labels += label(histState.sel);
  return `<svg viewBox="0 0 ${W} ${H}" class="histsvg" preserveAspectRatio="xMidYMid meet">${grid}${lines}${labels}${xlab}</svg>`;
}
function histLegend() {
  const { companies } = histSeries();
  return `<div class="histlegend">` + companies.map(c => {
    const pin = isPin(c), sel = histState.sel === c;
    return `<button class="histchip${pin?' pin':''}${sel?' sel':''}" onclick="selectHist('${esc(c)}')">${c}</button>`;
  }).join("") + `</div>`;
}
function histDetail() {
  if (!histState.sel) return `<div class="histhint">그래프의 선이나 아래 회사 버튼을 누르면 그 회사의 회차별 수치가 표로 나옵니다.</div>`;
  const { dates, series } = histSeries();
  const c = histState.sel, arr = series[c] || [], pin = series["핀다이렉트"] || [];
  const metric = HIST_PAGES.find(p => p.id === histState.page).metric;
  let rows = "";
  for (let i = dates.length-1; i >= 0; i--) {
    const v = arr[i], prev = i>0 ? arr[i-1] : null;
    const dlt = (v!=null && prev!=null) ? v-prev : null, pv = pin[i];
    const vs = (v!=null && pv!=null) ? v-pv : null;
    const vsCell = isPin(c) ? '—' : (vs==null ? '—' : `<span class="${vs>0?'histpos':vs<0?'histneg':''}">${(vs>0?'+':'')+fmt(vs)+'원'}</span>`);
    rows += `<tr><td>${dates[i]}</td><td>${v==null?'—':fmt(v)+'원'}</td><td>${dlt==null?'—':(dlt>0?'+':'')+fmt(dlt)+'원'}</td><td>${vsCell}</td></tr>`;
  }
  return `<div class="histdetailwrap"><div class="histdetailh">${c} · ${metric} 추이</div>
    <table class="histtable"><thead><tr><th>회차</th><th>${metric}</th><th>전회 대비</th><th>핀다 대비</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function setHistPage(id){ histState.page = id; histState.sel = null; renderHistory(); }
function setHistN(n){ histState.n = n; histState.from = null; histState.to = null; renderHistory(); }
function setHistRange(){
  const f = document.getElementById("histFrom"), t = document.getElementById("histTo");
  if (!f || !t) return;
  let from = f.value || null, to = t.value || null;
  if (from && to && from > to) { const tmp = from; from = to; to = tmp; }
  histState.from = from; histState.to = to; histState.n = -1;
  renderHistory();
}
function selectHist(c){ histState.sel = (histState.sel === c ? null : c); renderHistory(); }
function buildHistoryPage(){ return `<div id="histroot"></div>`; }
function renderHistory() {
  const root = document.getElementById("histroot"); if (!root) return;
  const total = (typeof HIST !== "undefined" ? HIST : []).length;
  const pInfo = HIST_PAGES.find(p => p.id === histState.page);
  const pbtns = HIST_PAGES.map(p => `<button class="histbtn${p.id===histState.page?' on':''}" onclick="setHistPage('${p.id}')">${p.label}</button>`).join("");
  const nbtns = [[0,"전체"]].map(([x,lab]) => `<button class="histbtn${histState.n===x?' on':''}" onclick="setHistN(${x})">${lab}</button>`).join("");
  const _allH = (typeof HIST !== "undefined" ? HIST : []);
  const dmin = _allH.length ? _allH[0].date : "", dmax = _allH.length ? _allH[_allH.length-1].date : "";
  const fromV = histState.from || dmin, toV = histState.to || dmax, rangeOn = histState.n === -1;
  const rangeInner = `<input type="date" id="histFrom" class="histdate" min="${dmin}" max="${dmax}" value="${fromV}" onchange="setHistRange()" onclick="try{this.showPicker()}catch(e){}" onfocus="try{this.showPicker()}catch(e){}">`
    + `<span class="histtil">~</span>`
    + `<input type="date" id="histTo" class="histdate" min="${dmin}" max="${dmax}" value="${toV}" onchange="setHistRange()" onclick="try{this.showPicker()}catch(e){}" onfocus="try{this.showPicker()}catch(e){}">`
    + `<button class="histbtn${rangeOn?' on':''}" onclick="setHistRange()">적용</button>`;
  const oneRound = total <= 1
    ? `<div class="histnote">아직 <b>${total}회차</b>뿐이라 기준점만 표시됩니다. 업데이트가 쌓이면 회사별 추이선이 그려집니다.</div>` : "";
  const meta = histSeries();
  const restartNote = meta.restarted
    ? `<div class="histnote" style="color:var(--amber);font-weight:700;">기준 상품이 <b>${meta.restartFrom}</b> 회차에 변경되어, 그 시점부터 새로 표시합니다(이전 기준 추이는 이어 붙이지 않습니다).</div>` : "";
  root.innerHTML = `<div class="card">
    <h2>가격 히스토리</h2>
    <div class="histctrls">
      <div class="histgrp">${pbtns}</div>
      <div class="histgrp">${nbtns}<span class="histvsep"></span><span class="histtil" style="margin:0 6px 0 0;font-weight:700">기간 선택</span>${rangeInner}</div>
    </div>
    <div class="histnote">회사별 <b>${pInfo.metric}(원)</b> 추이 · 선이나 회사 버튼을 누르면 상세 데이터가 열립니다.</div>
    ${oneRound}
    ${restartNote}
    ${histChartSvg()}
    ${histLegend()}
    ${histDetail()}
  </div>`;
}
// ===== CSV 내보내기 (이식) =====
function dl(text, name) {
  const blob = new Blob(["﻿" + text], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function exportCsv(catId) {
  const cat = CATS[catId];
  const pin = cat.rows.find(r => r.pin);
  const q = a => a.map(x => '"' + String(x).replace(/"/g,'""') + '"').join(",");
  const lines = [q(["회사","상품명","공급 형태","데이터","기간(일)","가격(원)","1일당(원)","자사 대비(원)"])];
  for (const r of [...cat.rows].sort((a,b)=>a.price-b.price)) {
    const diff = r.pin ? 0 : (pin ? r.price - pin.price : "");
    lines.push(q([r.c, r.n, r.type, r.data, r.days, r.price, Math.round(r.price/r.days), diff]));
  }
  dl(lines.join("\n"), "로밍_" + catId + ".csv");
}

tabDefs.forEach((t, i) => {
  const tab = document.createElement("div");
  tab.className = "tab" + (i === 0 ? " active" : "");
  tab.textContent = t.label;
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".page").forEach(x => x.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("pg_" + t.id).classList.add("active");
  };
  tabsEl.appendChild(tab);
  const pg = document.createElement("div");
  pg.className = "page" + (i === 0 ? " active" : "");
  pg.id = "pg_" + t.id;
  const region = REGIONS.find(r => r.id === t.id);
  const SECTAGS = {
    jp: '<div class="sectag"><span class="pill p-unl">데이터 무제한</span><span class="sub">기간 내 속도 제한 없음</span></div>',
    jd: '<div class="sectag" style="margin-top:30px;"><span class="pill p-dly">매일 1GB · 실속형</span><span class="sub">일 1GB 소진 후 저속 무제한</span></div>'
  };
  pg.innerHTML = t.id === "summary" ? buildSummaryPage()
    : t.id === "history" ? buildHistoryPage()
    : region.cats.map(k => (region.cats.length > 1 ? (SECTAGS[k] || "") : "") + buildCatPage(k, CATS[k])).join("");
  pages.appendChild(pg);
});
renderHistory();
</script>
